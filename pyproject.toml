[project]
name = "xtm"
version = "0.1.0"
description = "XTM: a CLI simulation environment for explainable travelling-model (sequential distributed) learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Enzo Racciatti" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "tensorflow>=2.20",
    "keras>=3.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
examples = ["medmnist>=3.0"]
dev = ["pytest>=8", "ruff>=0.6", "medmnist>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["venv", "xtm_demo"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# The original code base uses one-line compound statements and long messages.
ignore = ["E701", "E702", "E501", "W291", "W293", "E741", "E711", "E722", "F841"]
